type AlertConfigType {
  densityThreshold: Float!
  webhookUrl: String
}

type GraphEdgeType {
  fromZone: String!
  to: String!
  capacity: Float!
}

type HistorySeriesType {
  zoneId: String!
  values: [Float!]!
}

type IncidentType {
  id: ID!
  zoneId: String!
  zoneLabel: String!
  risk: RiskLevel!
  density: Float!
  t: Float
  suggestion: String!
  open: Boolean!
  createdAt: Float!
  resolvedAt: Float
}

type ModelMetaType {
  source: String!
  modelRepo: String!
  globalCount: Float!
  ready: Boolean!
  error: String
}

type ModelStatusType {
  ready: Boolean!
  device: String!
  repo: String!
  dataset: String!
  error: String
}

type Mutation {
  resetDemo: ResetDemoPayload!
  updateAlertConfig(densityThreshold: Float = null, webhookUrl: String = null): AlertConfigType!
  clearIncidents: ResetDemoPayload!
  ackIncident(id: ID!): IncidentType
  analyzeCamera(file: Upload!, phase: String = "camera_upload", reset: Boolean! = false): SnapshotType!
}

type Query {
  venue: VenueType!
  modelStatus: ModelStatusType!
  demoTick(t: Float! = 0): SnapshotType!
  incidents: [IncidentType!]!
  alertConfig: AlertConfigType!
}

type ResetDemoPayload {
  ok: Boolean!
}

enum RiskLevel {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

type RouteSuggestionType {
  fromZone: String!
  to: String!
  avoidZones: [String!]
  path: [String!]!
  pathLabels: [String!]!
  message: String!
}

type SnapshotType {
  venueId: String!
  venueName: String!
  t: Float
  phase: String
  note: String
  zones: [ZoneSnapshotType!]!
  bottlenecks: [String!]!
  routes: [RouteSuggestionType!]!
  suggestion: String!
  model: ModelMetaType!
  history: [HistorySeriesType!]!
  incidents: [IncidentType!]!
}

type Subscription {
  demoPlayback(start: Float! = 0, step: Float! = 0.5, intervalMs: Int! = 500): SnapshotType!
}

scalar Upload

type VenueGraphType {
  nodes: [String!]!
  edges: [GraphEdgeType!]!
}

type VenueType {
  id: String!
  name: String!
  width: Float!
  height: Float!
  zones: [VenueZoneType!]!
  graph: VenueGraphType!
}

type VenueZoneType {
  id: String!
  label: String!
  type: String!
  capacity: Float!
  polygon: [[Float!]!]!
  centroid: [Float!]!
}

type ZoneSnapshotType {
  id: String!
  label: String!
  type: String!
  capacity: Float!
  countEst: Float!
  density: Float!
  risk: RiskLevel!
  centroid: [Float!]!
  polygon: [[Float!]!]!
  trend: String
}
