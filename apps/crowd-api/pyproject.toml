[project]
name = "flowline-crowd-api"
version = "1.0.0"
description = "FLOWLINE crowd density, bottleneck, and reroute API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "python-multipart==0.0.20",
  "numpy==2.2.5",
  "pillow==11.2.1",
  "opencv-python-headless==4.11.0.86",
  "huggingface_hub==0.30.2",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "pydantic==2.11.4",
  "scipy==1.15.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
