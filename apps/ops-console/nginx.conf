server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://crowd-api:8001/api/;
  }

  location /graphql {
    proxy_pass http://crowd-api:8001/graphql;
  }

  location /health {
    proxy_pass http://crowd-api:8001/health;
  }

  location / {
    try_files $uri /index.html;
  }
}
