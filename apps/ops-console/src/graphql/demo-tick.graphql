query DemoTick($t: Float) {
  demoTick(t: $t) {
    venueId
    venueName
    t
    phase
    note
    bottlenecks
    suggestion
    zones {
      id
      label
      type
      capacity
      countEst
      density
      risk
      centroid
      polygon
      trend
    }
    routes {
      fromZone
      to
      avoidZones
      path
      pathLabels
      message
    }
    model {
      source
      modelRepo
      globalCount
      ready
      error
    }
    history {
      zoneId
      values
    }
    incidents {
      id
      zoneId
      zoneLabel
      risk
      density
      t
      suggestion
      open
      createdAt
      resolvedAt
    }
  }
}
