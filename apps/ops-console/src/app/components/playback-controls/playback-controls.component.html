<div class="controls">
  <button type="button" class="btn primary" (click)="playToggle.emit()">{{ label() }}</button>
  <button type="button" class="btn" (click)="resetDemo.emit()">Reset</button>
  <button type="button" class="btn" [disabled]="busy()" (click)="uploadClick.emit()">
    {{ busy() ? 'Analyzing…' : 'Upload camera frame' }}
  </button>
</div>
