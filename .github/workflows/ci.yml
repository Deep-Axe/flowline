name: flowline-ci

on:
  push:
  pull_request:

jobs:
  crowd-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crowd-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -r requirements.txt httpx pytest
      - name: Test
        env:
          PYTHONPATH: .
        run: pytest tests -q

  contracts-and-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install JS
        run: |
          rm -rf node_modules apps/ops-console/node_modules packages/contracts/node_modules
          npm ci
      - name: Install API deps for schema export
        run: python -m pip install -r apps/crowd-api/requirements.txt
      - name: Export OpenAPI + GraphQL schemas
        run: |
          python scripts/export_openapi.py
          python scripts/export_graphql.py
          npm --workspace packages/contracts run generate
          python scripts/stamp_contracts.py
          npm --workspace packages/contracts run check:stale
          npm --workspace apps/ops-console run codegen
          python scripts/stamp_graphql.py
          npm --workspace apps/ops-console run check:generated
      - name: Lint, test, typecheck, build Angular
        run: |
          npm --prefix apps/ops-console run lint
          npm --prefix apps/ops-console run test
          npm --prefix apps/ops-console run typecheck
          npm --prefix apps/ops-console run build

  integration:
    runs-on: ubuntu-latest
    needs: [crowd-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install + boot API
        run: |
          python -m pip install -r apps/crowd-api/requirements.txt
          PYTHONPATH=apps/crowd-api python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          sleep 8
          curl -sf http://127.0.0.1:8001/health
          curl -sf "http://127.0.0.1:8001/api/demo/tick?t=16" | python -c "import sys,json; d=json.load(sys.stdin); assert d['bottlenecks']"
          curl -sf http://127.0.0.1:8001/graphql -H 'content-type: application/json' -d '{"query":"query { venue { id } modelStatus { ready } demoTick(t: 16) { bottlenecks suggestion } }"}' | python -c "import sys,json; d=json.load(sys.stdin); assert d['data']['demoTick']['bottlenecks']"
