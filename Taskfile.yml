version: '3'

tasks:
  setup:
    desc: Install Python + JS dependencies
    cmds:
      - python -m venv .venv
      - '{{.VENV_PIP}} install -r apps/crowd-api/requirements.txt httpx pytest'
      - npm install
    vars:
      VENV_PIP:
        sh: python -c "import sys; print('.venv/Scripts/pip' if sys.platform.startswith('win') else '.venv/bin/pip')"

  contracts:
    desc: Export OpenAPI + GraphQL and regenerate clients
    cmds:
      - '{{.VENV_PYTHON}} scripts/export_openapi.py'
      - '{{.VENV_PYTHON}} scripts/export_graphql.py'
      - npm --workspace packages/contracts run generate
      - '{{.VENV_PYTHON}} scripts/stamp_contracts.py'
      - npm --workspace apps/ops-console run codegen
      - '{{.VENV_PYTHON}} scripts/stamp_graphql.py'
    vars:
      VENV_PYTHON:
        sh: python -c "import sys; print('.venv/Scripts/python' if sys.platform.startswith('win') else '.venv/bin/python')"

  api:
    desc: Run crowd-api on :8001
    cmds:
      - '{{.VENV_PYTHON}} -m uvicorn app.main:app --reload --reload-dir apps/crowd-api/app --host 127.0.0.1 --port 8001'
    dir: apps/crowd-api
    env:
      PYTHONPATH: '{{.ROOT}}/apps/crowd-api'
    vars:
      ROOT:
        sh: python -c "from pathlib import Path; print(Path('.').resolve())"
      VENV_PYTHON:
        sh: python -c "import sys; from pathlib import Path; root=Path('.').resolve(); print(root/('.venv/Scripts/python.exe' if sys.platform.startswith('win') else '.venv/bin/python'))"

  console:
    desc: Run ops-console on :5173
    cmds:
      - npm --prefix apps/ops-console run dev

  dev:
    desc: Run API + console together
    deps: [api, console]

  test:
    desc: Run API tests
    cmds:
      - '{{.VENV_PYTHON}} -m pytest apps/crowd-api/tests -q'
    env:
      PYTHONPATH: apps/crowd-api
    vars:
      VENV_PYTHON:
        sh: python -c "import sys; print('.venv/Scripts/python' if sys.platform.startswith('win') else '.venv/bin/python')"

  check:
    desc: Typecheck console, stale-contract check, API tests
    cmds:
      - task: contracts
      - npm --workspace packages/contracts run check:stale
      - npm --prefix apps/ops-console run check:generated
      - npm --prefix apps/ops-console run lint
      - npm --prefix apps/ops-console run test
      - npm --prefix apps/ops-console run typecheck
      - task: test

  build:
    desc: Production build for ops-console
    cmds:
      - npm --prefix apps/ops-console run build

  frames:
    desc: Regenerate sample camera frames
    cmds:
      - '{{.VENV_PYTHON}} scripts/generate_camera_frames.py'
    vars:
      VENV_PYTHON:
        sh: python -c "import sys; print('.venv/Scripts/python' if sys.platform.startswith('win') else '.venv/bin/python')"
